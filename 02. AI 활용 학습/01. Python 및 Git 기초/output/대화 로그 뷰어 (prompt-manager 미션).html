  });
  document.getElementById('count-all').textContent = counts.all;

  // Builds text nodes with <mark> wrapping every case-insensitive match of q.
  // Plain substring search (no RegExp) so arbitrary query text needs no escaping.
  function appendHighlighted(container, text, q) {
    if (!q) {
      container.appendChild(document.createTextNode(text));
      return;
    }
    var lower = text.toLowerCase();
    var qLower = q.toLowerCase();
    var lastIndex = 0;
    var idx = lower.indexOf(qLower);
    while (idx !== -1) {
      if (idx > lastIndex) {
        container.appendChild(document.createTextNode(text.slice(lastIndex, idx)));
      }
      var mark = document.createElement('mark');
      mark.textContent = text.slice(idx, idx + q.length);
      container.appendChild(mark);
      lastIndex = idx + q.length;
      idx = lower.indexOf(qLower, lastIndex);
    }
    if (lastIndex < text.length) {
      container.appendChild(document.createTextNode(text.slice(lastIndex)));
    }
  }

    var parts = [];
    if (annotation.terms) {
      annotation.terms.forEach(function (pair) { parts.push(pair[0], pair[1]); });
    }
    if (annotation.why) parts.push(annotation.why);
    if (annotation.example) parts.push(annotation.example);
    if (annotation.label) parts.push(annotation.label);
    return parts.join(' ');
  }

  function annotationMatches(annotation, q) {
    if (!q) return false;
    return annotationText(annotation).toLowerCase().indexOf(q) !== -1;
  }

        dl.appendChild(dt);

      });

    }

      var whyText = document.createElement('p');
      whyText.style.margin = '0';
      appendHighlighted(whyText, annotation.why, q);
      whyBox.appendChild(whyLabel);
      whyBox.appendChild(whyText);
      panel.appendChild(whyBox);
    }

    if (annotation.example) {
      var exBox = document.createElement('div');
      exBox.className = 'callout example';
      var exLabel = document.createElement('span');
      exLabel.className = 'callout-label';
      exLabel.textContent = '🧸 쉬운 예시';
      var exText = document.createElement('p');
      exText.style.margin = '0';
      appendHighlighted(exText, annotation.example, q);
      exBox.appendChild(exLabel);
      exBox.appendChild(exText);
      panel.appendChild(exBox);
    }

    return panel;
  }

  function render() {
    log.innerHTML = '';
    var q = query.trim().toLowerCase();
    var visible = 0;
    data.forEach(function (e) {
      var roleMatch = current === 'all' || e.role === current;
      var inAnnotation = e.annotation && annotationMatches(e.annotation, q);
      var textMatch = !q || e.text.toLowerCase().indexOf(q) !== -1 || (e.tool && e.tool.toLowerCase().indexOf(q) !== -1) || inAnnotation;
      if (!roleMatch || !textMatch) return;
      visible++;
      var el = document.createElement('div');
      el.className = 'entry';
      el.setAttribute('data-role', e.role);

      var rail = document.createElement('div');
      rail.className = 'rail';
      el.appendChild(rail);

      var body = document.createElement('div');
      body.className = 'entry-body';

      var meta = document.createElement('div');
      meta.className = 'entry-meta';
      var who = document.createElement('span');
      who.className = 'who';
      who.textContent = labels[e.role] || e.role;
      meta.appendChild(who);
      if (e.tool) {
        var tag = document.createElement('span');
        tag.className = 'tool-tag';
        appendHighlighted(tag, '[' + e.tool + ']', q);
        meta.appendChild(tag);
      }
      var ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = fmtTime(e.ts);
      meta.appendChild(ts);

      if (e.annotation) {
        var toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'annotation-toggle';
        toggle.setAttribute('aria-expanded', 'false');
        meta.appendChild(toggle);
      }
      body.appendChild(meta);

      var text = document.createElement('div');
      text.className = 'text';
      appendHighlighted(text, e.text, q);
      body.appendChild(text);

      if (e.annotation) {
        var panel = buildAnnotationPanel(e.annotation, q);
        var openByMatch = !!inAnnotation;
        if (openByMatch) panel.classList.add('open');
        toggle.textContent = openByMatch ? '해설 숨기기 (검색어 포함)' : '💡 해설 보기';
        toggle.setAttribute('aria-expanded', String(openByMatch));
        body.appendChild(panel);
        toggle.addEventListener('click', function (panel, toggle) {
          return function () {
            var open = panel.classList.toggle('open');
            toggle.setAttribute('aria-expanded', String(open));
            toggle.textContent = open ? '해설 숨기기' : '💡 해설 보기';
          };
        }(panel, toggle));
      }

      el.appendChild(body);
      log.appendChild(el);
    });
    if (visible === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = q ? '검색 결과가 없습니다: "' + query.trim() + '"' : '이 필터에 해당하는 항목이 없습니다.';
      log.appendChild(empty);
    }
    resultCount.textContent = q ? visible + '개 결과' : '';
    searchClear.classList.toggle('show', !!q);
  }

  tabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      current = btn.getAttribute('data-role');
      tabs.forEach(function (b) { b.setAttribute('aria-pressed', String(b === btn)); });
      render();
    });
  });

  searchInput.addEventListener('input', function () {
    query = searchInput.value;
    render();
  });
  searchInput.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      searchInput.value = '';
      query = '';
      render();
    }
  });
  searchClear.addEventListener('click', function () {
    searchInput.value = '';
    query = '';
    render();
    searchInput.focus();
  });

  render();
})();
</script>
